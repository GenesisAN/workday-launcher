# 示例配置（请复制为 config.toml 后再修改）
# 注意：本项目默认将“相对路径”按可执行文件所在目录（exe dir）解析。

# 要启动的程序：
# - 推荐使用绝对路径
# - 或者使用相对路径（相对于 exe dir）
# - 也可以写在 PATH 里的命令名（如 "cmd" / "python"）
command = "C:\\xxxx\\xxx.exe"

# 传给程序的参数
args = []

# 可选：工作目录（不填则继承当前目录）
# workdir = "./"

# 节假日 JSON 文件列表（支持多个年份）
# 数据来源（JSON）：https://unpkg.com/holiday-calendar@1.3.0/data/CN/
# 注意：请自行遵循上游数据的版权/许可条款。
holiday_json_files = ["./data/2025.json", "./data/2026.json"]

# 可选：找不到年份/日期时的默认行为
# "allow" 表示当日不在任何json里时，仅按周末/工作日规则判断
# "deny"  表示当日不在任何json里时，直接不执行（更保守）
missing_policy = "allow"

# 可选：反转模式（默认 false）
# true  表示只在节假日/周末执行，工作日跳过
# false 表示只在工作日执行，节假日/周末跳过（默认行为）
# 注意：反转模式下 missing_policy 同样生效
#   - "allow" + invert：周末执行，工作日跳过
#   - "deny"  + invert：日期不在json里时直接不执行
invert = false

# 可选：环境变量
[env]
RUST_LOG = "info"
